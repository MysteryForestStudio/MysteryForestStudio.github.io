<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mystery Forest Studio | Mystery Forest: Merge Legend</title>
  <link rel="icon" href="https://googleusercontent.com" />
  <style>
    :root {
      --bg-dark: #0e241b;
      --bg-card: #163629;
      --bg-cell: #1f4938;
      --gold: #f6c85f;
      --gold-light: #ffe399;
      --mint: #7ee8b5;
      --text-main: #f4f9f6;
      --text-muted: #b7d3c6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Noto Sans JP", sans-serif;
      background: radial-gradient(circle at top, #1b4634 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
    }
    a { color: var(--gold); text-decoration: none; }
    header {
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
      color: var(--gold-light);
    }
    .brand span { font-size: 1.4rem; }
    .lang-switch {
      display: flex;
      gap: 6px;
      background: rgba(0,0,0,0.28);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid rgba(246, 200, 95, 0.25);
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.2s;
    }
    .lang-btn.active {
      background: var(--gold);
      color: #162b21;
    }
    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 16px 20px 60px;
    }
    .hero {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: center;
      background: rgba(22, 54, 41, 0.85);
      border: 1px solid rgba(246, 200, 95, 0.28);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.35);
      margin-bottom: 36px;
    }
    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; padding: 24px 18px; }
    }
    .hero-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .app-icon {
      width: 82px;
      height: 82px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      border: 2px solid var(--gold);
      object-fit: cover;
    }
    .badge {
      display: inline-block;
      background: rgba(246, 200, 95, 0.18);
      color: var(--gold-light);
      border: 1px solid rgba(246, 200, 95, 0.4);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.85rem;
      line-height: 1.25;
      color: #fff;
    }
    .hero-desc {
      color: var(--text-muted);
      margin-bottom: 22px;
      font-size: 0.98rem;
    }
    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ffd466, #e5a935);
      color: #152b20;
      font-weight: 800;
      padding: 13px 22px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(229, 169, 53, 0.35);
      transition: transform 0.18s;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.18);
      font-weight: 600;
      padding: 13px 18px;
      border-radius: 14px;
      transition: 0.18s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.14); }

    /* Mini Merge Demo */
    .demo-box {
      background: #102a20;
      border: 2px solid rgba(126, 232, 181, 0.35);
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      position: relative;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.35);
    }
    .demo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .demo-title {
      font-weight: 800;
      color: var(--mint);
      font-size: 0.98rem;
    }
    .demo-score {
      background: rgba(246, 200, 95, 0.16);
      color: var(--gold-light);
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .butler-bubble {
      background: #1a4132;
      border: 1px solid rgba(246, 200, 95, 0.35);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.84rem;
      color: #fff6dc;
      margin-bottom: 12px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      max-width: 300px;
      margin: 0 auto 12px;
      position: relative;
    }
    .cell {
      aspect-ratio: 1 / 1;
      background: var(--bg-cell);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      border: 2px solid transparent;
      transition: transform 0.12s, border-color 0.15s, background 0.15s;
      position: relative;
    }
    .cell:hover { background: #265844; }
    .cell.selected {
      border-color: var(--gold);
      background: #2c664f;
      transform: scale(1.06);
      box-shadow: 0 0 12px rgba(246, 200, 95, 0.5);
    }
    .cell .emoji { font-size: 1.75rem; line-height: 1.1; }
    .cell .lvl { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
    .demo-controls {
      display: flex;
      justify-content: center;
      gap: 8px;
    }
    .mini-btn {
      background: var(--mint);
      color: #0e241b;
      border: none;
      padding: 7px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .mini-btn.reset {
      background: rgba(255,255,255,0.12);
      color: var(--text-main);
    }
    .star-pop {
      position: absolute;
      pointer-events: none;
      font-size: 1.1rem;
      animation: popUp 0.75s ease-out forwards;
    }
    @keyframes popUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-34px) scale(1.35); }
    }

    /* Features */
    .section-title {
      text-align: center;
      font-size: 1.45rem;
      color: var(--gold-light);
      margin-bottom: 20px;
    }
    .grid-features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 20px;
    }
    .card-icon { font-size: 1.8rem; margin-bottom: 8px; }
    .card h3 { font-size: 1.05rem; margin-bottom: 6px; color: #fff; }
    .card p { font-size: 0.88rem; color: var(--text-muted); }

    footer {
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 24px;
      text-align: center;
      font-size: 0.86rem;
      color: var(--text-muted);
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand"><span>🌲</span> Mystery Forest Studio</div>
  <div class="lang-switch">
    <button class="lang-btn active" onclick="setLang('zh')">繁體中文</button>
    <button class="lang-btn" onclick="setLang('en')">English</button>
    <button class="lang-btn" onclick="setLang('ja')">日本語</button>
  </div>
</header>

<main class="container">
  <section class="hero">
    <div>
      <div class="hero-top">
        <img class="app-icon" src="https://googleusercontent.com" alt="Mystery Forest Icon" />
        <div>
          <span class="badge" id="t-badge">🎄 全年 6 大節日版・官方搶先體驗</span>
          <h1>Mystery Forest: Merge Legend</h1>
        </div>
      </div>
      <p class="hero-desc" id="t-desc">
        繼承祖母留下的森林咖啡屋，施展奇幻合成魔法驅散黑暗咒語！全新加入全年 6 大節日自動巡航、森林管家三語（粵・英・日）語音祝福與治癒系寵物音效。
      </p>
      <div class="cta-group">
        <a class="btn-primary" href="https://play.google.com/store/apps/details?id=org.mysteryforest.mysteryforest" target="_blank" rel="noopener">
          <span>▶</span> <span id="t-dl">立即於 Google Play 下載</span>
        </a>
        <a class="btn-secondary" href="https://mysteryforeststudio.github.io/mystery-forest-privacy/" target="_blank" rel="noopener">
          <span>🛡️</span> <span id="t-priv">隱私權政策</span>
        </a>
      </div>
    </div>

    <!-- 4x4 Mini Merge Demo -->
    <div class="demo-box">
      <div class="demo-header">
        <div class="demo-title" id="t-demo-title">✨ Mini 森林合成搶先試玩</div>
        <div class="demo-score"><span id="t-coin-label">金幣</span>: <span id="coins">0</span></div>
      </div>
      <div class="butler-bubble" id="butler-msg">
        🎩 點選兩個相同圖案合成升級，目標合成「🎄聖誕樹」與「👑王冠」！
      </div>
      <div class="board" id="board"></div>
      <div class="demo-controls">
        <button class="mini-btn" onclick="spawnItem()" id="t-spawn">🌱 召喚新種子</button>
