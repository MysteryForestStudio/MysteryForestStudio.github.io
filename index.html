<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Forest Studio</title>
<meta name="description" content="Mystery Forest Studio — Mystery Forest: Merge Legend · Cozy Forest Café">
<style>
  :root{
    --bg1:#0f291e;
    --bg2:#1a3c2d;
    --bg3:#12261e;
    --warm:#ffd166;
    --cream:#ffecd2;
    --card:rgba(255,244,224,.08);
    --card-border:rgba(255,224,150,.25);
    --text:#f7f1e3;
    --muted:#d8cbb0;
    --accent:#8fd694;
    --gold:#ffd166;
    --shadow:0 14px 34px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Hiragino Sans","Noto Sans JP",sans-serif;
    color:var(--text);
    background:
      radial-gradient(600px 400px at 15% 8%, rgba(255,209,102,.10), transparent 60%),
      radial-gradient(700px 500px at 88% 30%, rgba(255,236,210,.08), transparent 60%),
      linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
    min-height:100vh;
    overflow-x:hidden;
    line-height:1.6;
  }
  #particles{position:fixed;inset:0;pointer-events:none;z-index:50}
  .frame{
    position:fixed;inset:0;pointer-events:none;z-index:49;
    border:10px solid var(--frame,#2f6b3a);
    box-shadow:inset 0 0 70px var(--frame-glow,rgba(72,160,96,.35));
    animation:breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{box-shadow:inset 0 0 45px var(--frame-glow,rgba(72,160,96,.35))}
    50%{box-shadow:inset 0 0 100px var(--frame-glow,rgba(72,160,96,.35))}
  }
  .wrap{max-width:820px;margin:0 auto;padding:22px 18px 60px;position:relative;z-index:10}

  /* top bar */
  .topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:20px}
  .capsule{
    background:var(--card);border:1px solid var(--card-border);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border-radius:999px;padding:11px 18px;font-size:.92rem;
    box-shadow:var(--shadow);
  }
  .capsule .fest{display:block;margin-top:2px;color:var(--gold)}
  .controls{display:flex;gap:8px;align-items:center}
  .btn-icon{
    background:var(--card);border:1px solid var(--card-border);color:var(--text);
    border-radius:999px;width:42px;height:42px;font-size:1.1rem;cursor:pointer;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .lang-switch{display:flex;gap:4px;background:var(--card);border:1px solid var(--card-border);border-radius:999px;padding:4px}
  .lang-switch button{
    background:transparent;border:0;color:var(--muted);cursor:pointer;
    padding:6px 12px;border-radius:999px;font-size:.85rem;
  }
  .lang-switch button.active{background:var(--gold);color:#3a2a08;font-weight:700}

  /* hero */
  header.hero{text-align:center;margin:14px 0 34px}
  .welcome{color:var(--cream);font-size:clamp(1.05rem,3vw,1.3rem);margin-bottom:16px;letter-spacing:.5px}
  .hero-icon{
    width:120px;height:120px;border-radius:34px;margin:0 auto 18px;
    background:var(--card);border:1px solid var(--card-border);
    display:flex;align-items:center;justify-content:center;font-size:68px;
    box-shadow:0 0 0 6px rgba(255,209,102,.12),0 0 44px rgba(255,209,102,.28),var(--shadow);
    position:relative;
  }
  .hero-icon img{width:88%;height:88%;object-fit:contain;border-radius:22px}
  .studio{color:var(--muted);font-size:1.05rem;margin-bottom:6px}
  h1{font-size:clamp(1.5rem,4.5vw,2.25rem);margin-bottom:10px;letter-spacing:.5px}
  .tagline{color:var(--muted);max-width:600px;margin:0 auto 20px}
  .badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:22px}
  .badge{
    background:var(--card);border:1px solid var(--card-border);border-radius:14px;
    padding:10px 16px;font-size:.9rem;backdrop-filter:blur(10px);
  }
  .gp-hero{
    display:inline-flex;align-items:center;gap:8px;
    background:linear-gradient(180deg,#3a9a6e 0%,#1f6b49 100%);
    border:1px solid rgba(255,224,150,.4);
    color:#fff;text-decoration:none;font-weight:700;font-size:1rem;
    padding:14px 26px;border-radius:999px;
    box-shadow:0 10px 24px rgba(31,107,73,.45),inset 0 1px 0 rgba(255,255,255,.25);
    animation:glowBreath 3.2s ease-in-out infinite;
  }
  @keyframes glowBreath{
    0%,100%{box-shadow:0 10px 24px rgba(31,107,73,.45),inset 0 1px 0 rgba(255,255,255,.25),0 0 0 0 rgba(255,209,102,.0)}
    50%{box-shadow:0 10px 28px rgba(31,107,73,.5),inset 0 1px 0 rgba(255,255,255,.25),0 0 26px rgba(255,209,102,.35)}
  }

  /* video card */
  .video-card{
    max-width:320px;margin:28px auto;border-radius:24px;overflow:hidden;
    background:var(--card);border:1px solid var(--card-border);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:var(--shadow);
  }
  .video-card h3{padding:14px 14px 0;font-size:.95rem}
  .video-card .frame-916{position:relative;width:100%;aspect-ratio:9/16;margin:8px 0}
  .video-card iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

  /* sections */
  section{margin:36px 0}
  h2{font-size:1.35rem;margin-bottom:18px;text-align:center}
  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
  .feature{
    background:var(--card);border:1px solid var(--card-border);border-radius:22px;
    padding:20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    transition:transform .18s,background .18s;
  }
  .feature:hover{transform:translateY(-4px);background:rgba(255,244,224,.14)}
  .feature .ico{font-size:1.8rem;margin-bottom:10px}
  .feature h3{margin-bottom:6px;font-size:1.02rem}
  .feature p{color:var(--muted);font-size:.9rem}

  /* cozy wall calendar */
  .cal-section{max-width:560px;margin:0 auto}
  .cal-card{
    background:linear-gradient(180deg,rgba(92,64,38,.35),rgba(60,42,26,.35));
    border:1px solid var(--card-border);border-radius:26px;padding:22px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    box-shadow:var(--shadow);position:relative;
  }
  .cal-card::before{
    content:"🪵";position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    font-size:1.4rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4));
  }
  .cal-greet{text-align:center;color:var(--cream);font-size:.94rem;margin-bottom:6px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
  .cal-title{font-size:1.12rem;font-weight:700;text-align:center;flex:1}
  .cal-nav{display:flex;gap:8px;align-items:center}
  .cal-nav button{
    background:var(--card);border:1px solid var(--card-border);color:var(--text);
    border-radius:12px;cursor:pointer;font-size:.88rem;padding:9px 12px;
  }
  .cal-nav button.today-btn{color:#3a2a08;background:var(--gold);border-color:transparent;font-weight:700}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-wd{text-align:center;font-size:.76rem;color:var(--muted);padding:6px 0;font-weight:600}
  .cal-day{
    aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:.9rem;position:relative;
    background:rgba(255,244,224,.07);min-height:44px;cursor:default;
  }
  .cal-day.clickable{cursor:pointer}
  .cal-day.other{opacity:.25}
  .cal-day.today{outline:2px solid var(--gold);background:rgba(255,209,102,.16)}
  .cal-day .day-emoji{font-size:.85rem;line-height:1;margin-bottom:2px}
  .cal-day .lunar{font-size:.6rem;color:var(--muted);line-height:1;margin-top:2px}
  .cal-day .dot{width:6px;height:6px;border-radius:50%;margin-top:3px}
  .dot.fest{background:#ffd34d;box-shadow:0 0 6px #ffd34d}
  .dot.release{background:#ff7ec4;box-shadow:0 0 6px #ff7ec4}
  .cal-day.has-fest{background:rgba(255,211,77,.12)}
  .cal-day.has-release{background:rgba(255,126,196,.12)}
  .legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:14px;font-size:.82rem;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%}
  .cal-diary{
    margin-top:16px;background:rgba(255,244,224,.09);border:1px dashed var(--card-border);
    border-radius:18px;padding:16px;min-height:64px;
  }
  .cal-diary .diary-date{font-size:.82rem;color:var(--gold);margin-bottom:4px}
  .cal-diary .diary-text{font-size:.92rem}
  .diary-actions{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
  .diary-btn{
    border:1px solid var(--card-border);border-radius:999px;padding:9px 16px;cursor:pointer;
    background:var(--gold);color:#3a2a08;font-weight:700;font-size:.88rem;
  }

  /* merge demo */
  .demo{
    background:var(--card);border:1px solid var(--card-border);border-radius:28px;
    padding:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    max-width:520px;margin:0 auto;box-shadow:var(--shadow);
  }
  .demo h2{margin-bottom:6px}
  .demo .sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:16px}
  .bubble{
    background:rgba(255,244,224,.14);border:1px dashed var(--card-border);
    border-radius:16px;padding:10px 14px;text-align:center;margin-bottom:14px;font-size:.92rem;min-height:42px;
  }
  .board{
    display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    background:rgba(0,0,0,.18);padding:12px;border-radius:22px;
  }
  .cell{
    aspect-ratio:1;border-radius:18px;background:rgba(255,244,224,.08);
    border:1px solid var(--card-border);display:flex;align-items:center;justify-content:center;
    font-size:clamp(1.6rem,6vw,2.3rem);cursor:pointer;transition:transform .12s,background .12s;user-select:none;
  }
  .cell:hover{background:rgba(255,244,224,.16)}
  .cell.sel{background:rgba(255,209,102,.28);outline:2px solid var(--gold)}
  .cell.empty{cursor:default}
  .demo-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  .action-btn{
    border:1px solid var(--card-border);border-radius:999px;padding:11px 18px;cursor:pointer;
    background:var(--card);color:var(--text);font-size:.92rem;backdrop-filter:blur(10px);
  }
  .action-btn.primary{background:var(--gold);color:#3a2a08;font-weight:700;border-color:transparent}
  .download-prompt{
    display:none;margin-top:16px;background:rgba(255,215,120,.14);
    border:1px solid rgba(255,215,120,.4);border-radius:18px;padding:16px;text-align:center;
  }
  .download-prompt.show{display:block}
  .download-prompt h3{margin-bottom:8px}
  .gp-link{
    display:inline-block;margin-top:8px;background:#1f8a5f;color:#fff;text-decoration:none;
    padding:11px 20px;border-radius:999px;font-weight:700;
  }

  /* night lights off mode */
  body.lights-off{
    background:linear-gradient(165deg,#08170f 0%,#0d2018 50%,#07120d 100%);
  }
  body.lights-off .frame{ --frame-glow:rgba(40,90,60,.22); }
  body.lights-off .hero-icon{
    box-shadow:0 0 0 6px rgba(255,209,102,.05),0 0 22px rgba(255,209,102,.12),var(--shadow);
  }
  body.lights-off .gp-hero{ animation:none; }
  .diary-story{margin-top:10px;border-top:1px dashed var(--card-border);padding-top:10px}
  .diary-story .story-label{font-size:.82rem;color:var(--gold);margin-bottom:4px}
  .diary-story .story-text{font-size:.9rem;color:var(--cream)}

  footer{
    margin-top:50px;padding-top:26px;border-top:1px solid var(--card-border);
    text-align:center;color:var(--muted);font-size:.88rem;
  }
  footer .flinks{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:14px 0}
  footer a{color:var(--gold);text-decoration:none}
  footer a:hover{text-decoration:underline}
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
    background:rgba(0,0,0,.8);padding:10px 18px;border-radius:12px;z-index:60;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1}
  @media (max-width:520px){
    .frame{border-width:6px}
    .demo{padding:16px}
    .cal-card{padding:16px}
    .cal-day{min-height:36px;border-radius:10px;font-size:.82rem}
    .cal-nav button{padding:8px 10px}
    .cal-grid{gap:4px}
    .cal-wd{font-size:.7rem;padding:4px 0}
    .topbar{gap:8px}
    .capsule{flex:1 1 100%;font-size:.84rem;padding:9px 14px}
    h1{font-size:1.32rem;line-height:1.3}
    .wrap{padding:14px 12px 50px}
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div class="frame" id="frame"></div>

<div class="wrap">
  <div class="topbar">
    <div class="capsule" id="calendarCapsule">
      <span id="todayLabel">📅</span>
      <span class="fest" id="festLabel"></span>
    </div>
    <div class="controls">
      <div class="lang-switch" id="langSwitch">
        <button data-lang="zh">繁中</button>
        <button data-lang="en">EN</button>
        <button data-lang="ja">日本語</button>
      </div>
      <button class="btn-icon" id="audioToggle" title="Sound">🔊</button>
      <button class="btn-icon" id="lightToggle" title="Lights">💡</button>
    </div>
  </div>

  <header class="hero">
    <p class="welcome" id="welcomeHome"></p>
    <div class="hero-icon">
      <img src="icon.png" alt="game icon" onerror="this.outerHTML='<span>🌲</span>'">
    </div>
    <div class="studio" id="studioName">Mystery Forest Studio</div>
    <h1 id="gameTitle">Mystery Forest</h1>
    <p class="tagline" id="tagline"></p>
    <div class="badges" id="badges"></div>
    <a class="gp-hero" id="gpHero" href="https://play.google.com/store/apps/details?id=org.mysteryforest.mysteryforest" target="_blank" rel="noopener"></a>

    <div class="video-card">
      <h3 id="videoTitle"></h3>
      <div class="frame-916">
        <iframe id="ytFrame" src="https://www.youtube-nocookie.com/embed/91k2erfq9lw?enablejsapi=1"
          title="YouTube Shorts" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
      </div>
    </div>
  </header>

  <section class="cal-section">
    <div class="cal-card">
      <p class="cal-greet" id="calGreet"></p>
      <div class="cal-head">
        <div class="cal-nav">
          <button id="calPrev" aria-label="Previous month"></button>
        </div>
        <div class="cal-title" id="calTitle"></div>
        <div class="cal-nav">
          <button id="calToday" class="today-btn" aria-label="Today"></button>
          <button id="calNext" aria-label="Next month"></button>
        </div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend">
        <span><i class="dot fest"></i><span id="legendFest"></span></span>
        <span><i class="dot release"></i><span id="legendRelease"></span></span>
      </div>
      <div class="cal-diary" id="calDiary">
        <div class="diary-date" id="diaryDate"></div>
        <div class="diary-text" id="diaryText"></div>
        <div class="diary-story">
          <div class="story-label" id="storyLabel"></div>
          <div class="story-text" id="storyText"></div>
        </div>
        <div class="diary-actions" id="diaryActions"></div>
      </div>
    </div>
  </section>

  <section>
    <h2 id="featuresTitle"></h2>
    <div class="features" id="features"></div>
  </section>

  <section class="demo">
    <h2 id="demoTitle"></h2>
    <p class="sub" id="demoSub"></p>
    <div class="bubble" id="bubble"></div>
    <div class="board" id="board"></div>
    <div class="demo-actions">
      <button class="action-btn primary" id="summonBtn"></button>
      <button class="action-btn" id="shareBtn"></button>
    </div>
    <div class="download-prompt" id="downloadPrompt">
      <h3 id="promptTitle"></h3>
      <p id="promptDesc"></p>
      <a class="gp-link" id="gpLink" href="https://play.google.com/store/apps/details?id=org.mysteryforest.mysteryforest" target="_blank" rel="noopener"></a>
    </div>
  </section>

  <footer>
    <div class="flinks">
      <a id="footerPlay" href="https://play.google.com/store/apps/details?id=org.mysteryforest.mysteryforest" target="_blank" rel="noopener"></a>
      <a id="footerPrivacy" href="https://mysteryforeststudio.github.io/mystery-forest-privacy/" target="_blank" rel="noopener"></a>
      <a id="footerEmail" href="mailto:mysteryforest.dev@gmail.com"></a>
    </div>
    <div>© 2026 Mystery Forest Studio. All rights reserved.</div>
  </footer>
</div>

<div class="toast" id="toast"></div>

let lang = localStorage.getItem("mfs_lang");
if (!lang || !I18N[lang]) lang = "zh";

const $ = id => document.getElementById(id);
function t(key){
  const cur = I18N[lang];
  return (cur[key] !== undefined) ? cur[key] : I18N.zh[key];
}

function applyLang(){
  document.documentElement.lang = lang;
  $("welcomeHome").textContent = t("welcomeHome");
  $("studioName").textContent = t("studio");
  $("gameTitle").textContent = t("gameTitle");
  $("tagline").textContent = t("tagline");
  $("gpHero").textContent = t("gp");
  $("videoTitle").textContent = t("videoTitle");
  $("demoTitle").textContent = t("demoTitle");
  $("demoSub").textContent = t("demoSub");
  $("summonBtn").textContent = t("summon");
  $("shareBtn").textContent = t("share");
  $("promptTitle").textContent = t("promptTitle");
  $("promptDesc").textContent = t("promptDesc");
  $("gpLink").textContent = t("gp");
  $("footerPlay").textContent = t("footerPlay");
  $("footerPrivacy").textContent = t("footerPrivacy");
  $("footerEmail").textContent = t("footerEmail");

  const badgeWrap = $("badges"); badgeWrap.innerHTML = "";
  t("badges").forEach(b => { const s=document.createElement("span"); s.className="badge"; s.textContent=b; badgeWrap.appendChild(s); });

  const featWrap = $("features"); featWrap.innerHTML = "";
  t("features").forEach(f => {
    const c=document.createElement("div"); c.className="feature";
    c.innerHTML = `<div class="ico">${f.ico}</div><h3></h3><p></p>`;
    c.querySelector("h3").textContent=f.t; c.querySelector("p").textContent=f.d;
    featWrap.appendChild(c);
  });

  if (!boardInitialized) initBoard(); else renderBoard();
  updateBubble(t("bubbleIdle"));
  document.querySelectorAll("#langSwitch button").forEach(b => b.classList.toggle("active", b.dataset.lang===lang));
  updateCalendar();
  renderCalendar();
  applyLights();
}

document.querySelectorAll("#langSwitch button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    lang = btn.dataset.lang;
    localStorage.setItem("mfs_lang", lang);
    applyLang();
  });
});

  const a=y%19, b=Math.floor(y/100), c=y%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3);
  let h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4;
  let l=(32+2*e+2*i-h-k)%7;
  if (h===29 && l===6) h=28;
  if (h===28 && a>10 && l===6) h=27;
  l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(y, month-1, day);
}

function addDays(d, n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function inRange(d, start, end){ return d >= start && d <= end; }

function fixedWindow(y, sm, sd, em, ed){
  let s = new Date(y, sm-1, sd), e = new Date(y, em-1, ed);
  if (em < sm || (em===sm && ed<sd)){ e = new Date(y+1, em-1, ed); }
  return [s,e];
}

function festivalWindow(fest, y){
  switch(fest){
    case "christmas": return fixedWindow(y,12,15,12,28);
    case "new_year":  return fixedWindow(y,12,29,1,5);
    case "valentine": return fixedWindow(y,2,10,2,16);
    case "halloween": return fixedWindow(y,10,24,11,2);
    case "lunar_new_year": {
      const c = LUNAR_CNY[y]; if(!c) return null;
      const center = new Date(y, c[0]-1, c[1]);
      return [addDays(center,-7), addDays(center,7)];
    }
    case "easter": {
      const center = easterSunday(y);
      return [addDays(center,-7), addDays(center,7)];
    }
  }
  return null;
}

const FEST_ORDER = ["christmas","new_year","lunar_new_year","valentine","easter","halloween"];

function detectFestival(now){
  const url = new URLSearchParams(location.search);
  const forced = url.get("fest");
  if (forced && FEST_ORDER.includes(forced)) return forced;
  const y = now.getFullYear();
  for (const fest of FEST_ORDER){
    const w = festivalWindow(fest, y);
    if (w && inRange(now, w[0], w[1])) return fest;
  }
  return "normal";
}

function nextFestival(now){
  let best = null;
  for (let y = 2026; y <= 2048; y++){
    for (const fest of FEST_ORDER){
      const w = festivalWindow(fest, y);
      if (!w) continue;
      if (w[1] >= now){
        if (!best || w[0] < best.date) best = { fest, date: w[0] };
      }
    }
  }
  return best;
}

/* 版本發布紀念日：可自行增減，格式 { date:"YYYY-MM-DD", ico, key } */
const RELEASES = [
  { date:"2026-11-26", ico:"🚀", key:"v1012" }
];

let calView = new Date(); calView.setDate(1);
let previewLock = false;

function dateKey(y,m,d){ return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }

function buildMarkers(y, m){
  const map = {};
  const add = (date, type, payload) => {
    const k = dateKey(date.getFullYear(), date.getMonth(), date.getDate());
    if(!map[k]) map[k] = { fest:[], release:null };
    if(type==="fest") map[k].fest.push(payload);
    else map[k].release = payload;
  };
  for (const fy of [y-1, y, y+1]){
    for (const fest of FEST_ORDER){
      const w = festivalWindow(fest, fy);
      if(!w) continue;
      let cur = new Date(w[0]);
      while(cur <= w[1]){
        if(cur.getFullYear()===y && cur.getMonth()===m) add(cur, "fest", fest);
        cur = addDays(cur, 1);
      }
    }
  }
  RELEASES.forEach(r=>{
    const [ry,rm,rd] = r.date.split("-").map(Number);
    if(ry===y && rm-1===m){
      add(new Date(ry,rm-1,rd), "release", { ico:r.ico, label:t("releases")[r.key] });
    }
  });
  return map;
}

    const el=document.createElement("div"); el.className="cal-wd"; el.textContent=w; grid.appendChild(el);
  });

  const first = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();
  const now = new Date();

  for(let i=0;i<first;i++){
    const el=document.createElement("div"); el.className="cal-day other";
    el.textContent = prevDays - first + 1 + i; grid.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){

    const k = dateKey(y,m,d);
    const mk = markers[k];
    const dateObj = new Date(y,m,d);
    const isToday = sameDay(now, dateObj);
    if(isToday) el.classList.add("today");
    let ico="", dotClass="fest", titleParts=[];
    let hasFest=false, hasRelease=false;
    if(mk){
      if(mk.fest.length){ hasFest=true; el.classList.add("has-fest"); mk.fest.forEach(f=>titleParts.push(t("festivals")[f])); }
      if(mk.release){ hasRelease=true; el.classList.add("has-release"); titleParts.push(mk.release.label); ico=mk.release.ico; dotClass="release"; }

    el.title = titleParts.join(" · ");

  for(let i=0;i<trailing;i++){
    const el=document.createElement("div"); el.className="cal-day other";
    el.textContent = i+1; grid.appendChild(el);
  }

}

const LUNAR_MONTH = ["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","臘月"];
const LUNAR_DAY = ["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];

function lunarYearInfo(year){
  const e = ENCODED_LUNAR[year - LUNAR_MIN_YEAR];
  return {
    year,
    hasLeap: Boolean(e & (1 << 19)),
    leapIdx: (e & (1 << 19)) ? (e >> 20 & 15) : null,
    startMonth: e >> 18 & 1,
    startDay: e >> 13 & 31,
    bits: e & ((1 << 13) - 1)
  };
}
function lunarSegmentDays(info, si){ return info.bits & (1 << si) ? 30 : 29; }

function solar2lunar(y, m, d){
  let info = lunarYearInfo(y);
  let start = Date.UTC(y, info.startMonth, info.startDay);
  const dateUTC = Date.UTC(y, m - 1, d);
  if (dateUTC < start){
    info = lunarYearInfo(y - 1);
    start = Date.UTC(info.year, info.startMonth, info.startDay);
  }
  const diff = Math.floor((dateUTC - start) / 86400000);
  const total = 12 + (info.hasLeap ? 1 : 0);
  let acc = 0, mi = 0, ml = 0;
  while(mi < total){
    ml = lunarSegmentDays(info, mi);
    acc += ml;
    if(diff < acc) break;
    mi++;
  }
  const day = ml - (acc - diff) + 1;
  let disp = mi, isLeap = false;
  if(info.hasLeap && info.leapIdx !== null){
    if(mi === info.leapIdx + 1) isLeap = true;
    if(mi > info.leapIdx) disp -= 1;
  }
  const monthName = (isLeap ? "閏" : "") + LUNAR_MONTH[disp];
  return { ly:info.year, lm:disp+1, ld:day, isLeap, monthName, dayName:LUNAR_DAY[day-1] };
}

/* ============================================================
   3. Canvas 粒子層（fixed / inset 0 / pointer-events none / z-index 50）
   ============================================================ */
const canvas = $("particles");
const ctx = canvas.getContext("2d");
let particles = [];
let W = 0, H = 0;

function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize); resize();

function buildParticles(){
  particles = [];
  const theme = FEST_THEME[currentFest];
  const count = currentFest==="normal" ? 34 : 42;
  for (let i=0;i<count;i++){
    particles.push(spawnParticle(theme, true));
  }
  applyThemeFrame();
}

function spawnParticle(theme, anywhere){
  const emoji = theme.particles.length ? theme.particles[Math.floor(Math.random()*theme.particles.length)] : null;
  const color = theme.colors[Math.floor(Math.random()*theme.colors.length)];
  const mode = theme.mode;
  let vx=0, vy=0, size=(mode==="firefly"? 1.5+Math.random()*2.5 : 10+Math.random()*12);
  if (mode==="snow"){ vy=0.4+Math.random()*0.9; vx=-0.3+Math.random()*0.6; }
  else if (mode==="sparkle"){ vy=0.5+Math.random()*1.0; vx=-0.4+Math.random()*0.8; }
  else if (mode==="petal"){ vy=0.5+Math.random()*0.8; vx=Math.sin(Math.random()*6)*0.7; }
  else if (mode==="heart"){ vy=0.4+Math.random()*0.7; vx=-0.4+Math.random()*0.8; }
  else if (mode==="bloom"){ vy=0.3+Math.random()*0.6; vx=-0.5+Math.random()*1.0; }
  else if (mode==="magic"){ vy=0.3+Math.random()*0.7; vx=-0.5+Math.random()*1.0; }
  else { vx=-0.3+Math.random()*0.6; vy=-0.2+Math.random()*0.4; }
  return {
    x: Math.random()*W,
    y: anywhere ? Math.random()*H : -20,
    vx, vy, size, color, emoji, mode,
    phase: Math.random()*Math.PI*2,
    alpha: 0.5+Math.random()*0.5
  };
}

function applyThemeFrame(){
  const th = FEST_THEME[currentFest];
  document.documentElement.style.setProperty("--frame", th.frame);
  document.documentElement.style.setProperty("--frame-glow", th.glow);
}

function tickParticles(){
  ctx.clearRect(0,0,W,H);
  const th = FEST_THEME[currentFest];
  for (let i=0;i<particles.length;i++){
    const p = particles[i];
    p.phase += 0.03;
    if (p.mode==="burst"){
      p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life -= 0.02;
      if (p.life<=0){ particles.splice(i,1); i--; continue; }
      ctx.globalAlpha = Math.max(0,p.life);
      ctx.font = p.size+"px serif";
      ctx.fillText(p.emoji, p.x, p.y);
      continue;
    }
    if (p.mode==="firefly"){
      p.x += p.vx + Math.sin(p.phase)*0.3;
      p.y += p.vy + Math.cos(p.phase*0.7)*0.2;
      if (p.y<0) p.y=H; if (p.y>H) p.y=0;
      if (p.x<0) p.x=W; if (p.x>W) p.x=0;
      const glow = 0.4 + Math.sin(p.phase)*0.3;
      ctx.globalAlpha = Math.max(0.1, glow);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha = Math.max(0.05, glow*0.3);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*3,0,Math.PI*2); ctx.fill();
    } else {
      p.x += p.vx + Math.sin(p.phase)*0.4;
      p.y += p.vy;
      if (p.y > H+20){ particles[i]=spawnParticle(th,false); continue; }
      if (p.emoji){
        ctx.globalAlpha = p.alpha;
        ctx.font = p.size+"px serif";
        ctx.fillText(p.emoji, p.x, p.y);
      } else {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size/3,0,Math.PI*2); ctx.fill();
      }
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(tickParticles);
}

    ["D5",2],["A4",2],["D5",2]
  ]},
  easter: { tempo:112, seq:[
    ["E5",1],["E5",1],["E5",1],["B4",1],["A4",1],["B4",1],["C5",2],
    ["D5",1],["E5",1],["F#5",1],["E5",1],["D5",1],["E5",1],["B4",2],
    ["C5",1],["D5",1],["E5",1],["G5",1],["F#5",1],["E5",1],["D5",1],["C5",1],
    ["B4",1],["C5",1],["D5",1],["B4",1],["A4",2]
  ]},
  halloween: { tempo:90, seq:[
    ["A4",1],["C5",1],["E5",1],["F5",1],["E5",1],["C5",1],
    ["D4",1],["F5",1],["A5",1],["G5",1],["F5",1],["D5",1],
    ["A4",1],["C5",1],["E5",1],["A5",1],["G#5",1],["E5",1],
    ["F5",1],["E5",1],["C5",1],["A4",1],["C5",2]
  ]},
  normal: { tempo:72, seq:[
    ["C5",1],["D5",1],["E5",1],["G5",1],["A5",1],["C6",1],
    ["A5",1],["G5",1],["E5",1],["D5",1],["E5",1],["G5",1],
    ["C5",1],["D5",1],["E5",1],["G5",1],["A5",1],["C6",2],
    ["A5",1],["G5",1],["E5",1],["D5",1],["C5",2]
  ]}
};

let audioCtx=null, masterGain=null, musicGain=null, delayNode=null;
let musicOn = true, musicStarted=false, musicPausedByVideo=false;
let schedulerTimer=null, nextNoteTime=0, noteIndex=0, currentSeq=MELODIES.normal.seq, currentTempo=72;

function ensureAudio(){
  if (audioCtx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 1;
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.25;
  musicGain.connect(masterGain);

  delayNode = audioCtx.createDelay(1.0);
  delayNode.delayTime.value = 0.28;
  const feedback = audioCtx.createGain(); feedback.gain.value = 0.25;
  const wet = audioCtx.createGain(); wet.gain.value = 0.3;
  delayNode.connect(feedback); feedback.connect(delayNode);
  delayNode.connect(wet); wet.connect(musicGain);

  masterGain.connect(audioCtx.destination);
}

function playNote(note, start, dur){
  if (!note) return;
  const f = freq(note);
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc1.type="sine"; osc2.type="triangle";
  osc1.frequency.value=f; osc2.frequency.value=f;
  const g2 = audioCtx.createGain(); g2.gain.value=0.35;
  osc1.connect(g); osc2.connect(g2); g2.connect(g);
  g.connect(musicGain);
  g.connect(delayNode);

  const attack = 0.02, release = Math.min(0.6, dur*0.9);
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(0.5, start+attack);
  g.gain.setValueAtTime(0.5, start+Math.max(attack, dur*0.5));
  g.gain.exponentialRampToValueAtTime(0.0001, start+dur+release);

  osc1.start(start); osc2.start(start);
  osc1.stop(start+dur+release+0.1); osc2.stop(start+dur+release+0.1);
}

function scheduler(){
  if (!audioCtx || !musicOn || musicPausedByVideo) return;
  const ahead = 0.15;
  while (nextNoteTime < audioCtx.currentTime + ahead){
    const [note, beats] = currentSeq[noteIndex];
    const beatSec = 60/currentTempo;
    const dur = beats*beatSec;
    playNote(note, nextNoteTime, dur);
    nextNoteTime += dur;
    noteIndex = (noteIndex+1) % currentSeq.length;
  }
}

function startMusic(){
  ensureAudio();
  if (!audioCtx) return;
  if (audioCtx.state === "suspended") audioCtx.resume();
  if (!musicStarted){
    musicStarted = true;
    nextNoteTime = audioCtx.currentTime + 0.1;
    noteIndex = 0;
    schedulerTimer = setInterval(scheduler, 40);
  }
}

function setFestivalMusic(fest){
  const m = MELODIES[fest] || MELODIES.normal;
  currentSeq = m.seq; currentTempo = m.tempo; noteIndex = 0;
  if (audioCtx) nextNoteTime = Math.max(nextNoteTime, audioCtx.currentTime+0.05);
}

function unlockAudio(){
  startMusic();
  document.removeEventListener("pointerdown", unlockAudio);
  document.removeEventListener("keydown", unlockAudio);
}
document.addEventListener("pointerdown", unlockAudio);
document.addEventListener("keydown", unlockAudio);
window.addEventListener("load", ()=>{ try{ startMusic(); }catch(e){} });

$("audioToggle").addEventListener("click", ()=>{
  musicOn = !musicOn;
  $("audioToggle").textContent = musicOn ? t("audioOn") : t("audioOff");
  if (musicOn){ startMusic(); if(audioCtx) musicGain.gain.setTargetAtTime(0.25, audioCtx.currentTime, 0.1); }
  else if (audioCtx){ musicGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.1); }
});

/* 咖啡屋夜景燈光開關（localStorage 記住偏好） */
let lights = localStorage.getItem("mfs_lights") !== "off";
function applyLights(){
  document.body.classList.toggle("lights-off", !lights);
  $("lightToggle").textContent = lights ? t("lightOn") : t("lightOff");
}
$("lightToggle").addEventListener("click", ()=>{

/* 每日一則管家小故事：依日期固定輪播，三語切換 */
function dailyStory(date){
  const stories = t("stories");
  const start = new Date(date.getFullYear(), 0, 0);
  const doy = Math.floor((date - start) / 86400000);
  return stories[((doy % stories.length) + stories.length) % stories.length];
}

window.addEventListener("message", (ev)=>{
  if (!/youtube\.com$/.test(ev.origin) && !/youtube/.test(ev.origin)) return;
  let data = null;
  try { data = typeof ev.data==="string" ? JSON.parse(ev.data) : ev.data; } catch(e){ return; }
  if (!data) return;
  const state = data.event || (data.infoListData && data.infoListData.state);
  if (state === 1){ musicPausedByVideo = true; if(audioCtx) musicGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.1); }
  else if (state === 2 || state === 0){ musicPausedByVideo = false; if(audioCtx && musicOn) musicGain.gain.setTargetAtTime(0.25, audioCtx.currentTime, 0.2); }
});

function playMergeSound(levelUp){
  ensureAudio(); if(!audioCtx) return;
  if (audioCtx.state==="suspended") audioCtx.resume();
  const base = audioCtx.currentTime;
  const notes = levelUp>=4 ? ["E6","G6","C7"] : ["C6","E6","G6"];
  notes.forEach((n,i)=>{
    const f=freq(n), o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001, base+i*0.06);
    g.gain.exponentialRampToValueAtTime(0.35, base+i*0.06+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, base+i*0.06+0.5);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(base+i*0.06); o.stop(base+i*0.06+0.6);
  });
}

/* ============================================================
   5. 4×4 迷你合成搶先體驗版
   ============================================================ */
const LEVELS = ["🌱","🌿","🌸","🍄","🎄","👑"];
const GRID = 16;
let board = [];
let selected = -1;
let boardInitialized = false;

function randomStartLevel(){ return Math.random()<0.5 ? 0 : 1; }

function initBoard(){
  board = [];
  for (let i=0;i<GRID;i++) board.push(randomStartLevel());
  const hasPair = board.some((v,i)=> board.indexOf(v)!==i);
  if (!hasPair){ board[0]=0; board[1]=0; }
  selected = -1;
  boardInitialized = true;
  renderBoard();
}

function renderBoard(){
  const el = $("board"); el.innerHTML="";
  board.forEach((lv, i)=>{
    const c = document.createElement("div");
    c.className = "cell" + (lv===null ? " empty" : "") + (i===selected ? " sel" : "");
    c.textContent = lv===null ? "" : LEVELS[lv];
    c.addEventListener("click", ()=>onCellClick(i));
    el.appendChild(c);
  });
}

function onCellClick(i){
  startMusic();
  if (board[i]===null) return;
  if (selected===-1){ selected=i; renderBoard(); return; }
  if (selected===i){ selected=-1; renderBoard(); return; }
  const a = board[selected], b = board[i];
  if (a===b && a<LEVELS.length-1){
    board[selected] = a+1;
    board[i] = null;
    playMergeSound(a+1);
    burstParticles(cellCenter(i), LEVELS[a+1]);
    const pool = t("bubbleMerge");
    updateBubble(pool[Math.floor(Math.random()*pool.length)]);
    if (a+1>=4){ showDownloadPrompt(); }
    selected=-1; renderBoard();
  } else if (a===b){
    updateBubble(t("bubbleNoMatch"));
    selected=-1; renderBoard();
  } else {
    selected=i; renderBoard();
    updateBubble(t("bubbleNoMatch"));
  }
}

function cellCenter(i){
  const cells = $("board").children;
  if (!cells[i]) return {x:W/2,y:H/2};
  const r = cells[i].getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2};
}

function burstParticles(center, emoji){
  for (let k=0;k<14;k++){
    const ang = Math.random()*Math.PI*2;
    const sp = 1+Math.random()*2.5;
    particles.push({
      x:center.x, y:center.y,
      vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-1,
      size:10+Math.random()*10, color:"#ffe97a", emoji:"⭐",
      mode:"burst", phase:0, alpha:1, life:1
    });
  }
}

function updateBubble(msg){ $("bubble").textContent = msg; }

function showDownloadPrompt(){ $("downloadPrompt").classList.add("show"); }

$("summonBtn").addEventListener("click", ()=>{
  startMusic();
  const empties = board.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
  if (empties.length===0){ updateBubble(t("bubbleNoMatch")); return; }
  const idx = empties[Math.floor(Math.random()*empties.length)];
  board[idx] = randomStartLevel();
  renderBoard();
});

$("shareBtn").addEventListener("click", async ()=>{
  const shareData = {
    title: t("gameTitle"),
    text: t("tagline"),
    url: "https://mysteryforeststudio.github.io/"
  };
  try {
    if (navigator.share){ await navigator.share(shareData); showToast(t("toastShared")); }
    else { await navigator.clipboard.writeText(shareData.url); showToast(t("toastCopied")); }
  } catch(e){
    try { await navigator.clipboard.writeText(shareData.url); showToast(t("toastCopied")); }
    catch(err){ showToast(shareData.url); }
  }
});

let toastTimer=null;
function showToast(msg){
  const el=$("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}

buildParticles();
tickParticles();

setInterval(()=>{
  if (previewLock) return;
  const now = new Date();
  const fest = detectFestival(now);
  if (fest !== currentFest){
    currentFest = fest;
    setFestivalMusic(fest);
    buildParticles();
    updateCalendar();
  }
}, 60000);
